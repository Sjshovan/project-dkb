name: dkb-${DKB_STACK_NAME:-local}

x-registry-environment: &registry-environment
  APP_ENV: local
  APP_DEBUG: "false"
  APP_KEY: ${DKB_REGISTRY_APP_KEY:?Run dkb stack up to generate stack secrets}
  APP_URL: http://127.0.0.1:${DKB_REGISTRY_PORT:-8018}
  DB_CONNECTION: sqlite
  DB_DATABASE: /data/registry.sqlite
  DB_BUSY_TIMEOUT: "30000"
  DB_JOURNAL_MODE: WAL
  DB_SYNCHRONOUS: NORMAL
  CACHE_STORE: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  DKB_REGISTRY_ID: ${DKB_STACK_NAME:-local}
  DKB_REGISTRY_STORAGE_DISK: registry
  DKB_COMPILER_URL: http://dkb-compiler:7341
  DKB_COMPILER_TIMEOUT: "3600"
  DB_QUEUE_RETRY_AFTER: "3720"
  DKB_REGISTRY_BOOTSTRAP_EMAIL: dkb@local.invalid
  DKB_REGISTRY_BOOTSTRAP_NAME: Local DKB Operator
  DKB_REGISTRY_BOOTSTRAP_NAMESPACE: ${DKB_REGISTRY_BOOTSTRAP_NAMESPACE:-local}
  DKB_REGISTRY_BOOTSTRAP_TOKEN: ${DKB_REGISTRY_BOOTSTRAP_TOKEN:?Run dkb stack up to generate stack secrets}

x-registry-volumes: &registry-volumes
  - ${DKB_STACK_STATE:?DKB_STACK_STATE is required}/registry/data:/data
  - ${DKB_STACK_STATE:?DKB_STACK_STATE is required}/registry/storage:/var/www/html/storage/app/registry

services:
  registry-migrate:
    image: ${DKB_REGISTRY_IMAGE:-dkb-registry:0.1.0}
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    environment: *registry-environment
    volumes: *registry-volumes
    restart: "no"

  registry-bootstrap:
    image: ${DKB_REGISTRY_IMAGE:-dkb-registry:0.1.0}
    command: ["php", "artisan", "registry:bootstrap", "--no-interaction"]
    environment: *registry-environment
    volumes: *registry-volumes
    depends_on:
      registry-migrate:
        condition: service_completed_successfully
    restart: "no"

  registry-web:
    image: ${DKB_REGISTRY_IMAGE:-dkb-registry:0.1.0}
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    environment: *registry-environment
    volumes: *registry-volumes
    ports:
      - "127.0.0.1:${DKB_REGISTRY_PORT:-8018}:8000"
    depends_on:
      registry-bootstrap:
        condition: service_completed_successfully
      dkb-compiler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(json_decode(file_get_contents('http://127.0.0.1:8000/health'), true)['ok'] === true ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  registry-worker:
    image: ${DKB_REGISTRY_IMAGE:-dkb-registry:0.1.0}
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=1", "--timeout=3660", "--no-interaction"]
    environment: *registry-environment
    volumes: *registry-volumes
    depends_on:
      registry-bootstrap:
        condition: service_completed_successfully
      dkb-compiler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains(file_get_contents('/proc/1/cmdline'), 'queue:work') ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  dkb-compiler:
    image: ${DKB_COMPILER_IMAGE:-dkb-compiler:0.2.0}
    environment:
      DKB_COMPILER_HOST: 0.0.0.0
      DKB_COMPILER_PORT: 7341
      DKB_COMPILER_ALLOWED_TARGETS: ${DKB_COMPILER_ALLOWED_TARGETS-}
      DKB_COMPILER_DEFAULT_TARGET: ${DKB_COMPILER_DEFAULT_TARGET:-default}
      DKB_CONTEXT_ROOT: /context
      DKB_COMPILER_WORK_ROOT: /jobs/api
      DKB_LLAMA_COMPILER_SERVICE_URL: http://dkb-compiler-worker:8091
      DKB_LLAMA_COMPILER_SERVICE_ROOT: /
      DKB_LLAMA_COMPILER_TIMEOUT_MS: "3600000"
      DKB_LLAMA_ASYNC_WORKERS: "1"
      DKB_QUERY_EMBEDDER_URL: http://dkb-embedder:8090/embed
      DKB_TEI_URL: http://dkb-tei:80
      DKB_FAISS_SERVICE_URL: http://dkb-faiss:8092
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${DKB_MEILI_MASTER_KEY}
    volumes:
      - ${DKB_STACK_STATE:?DKB_STACK_STATE is required}/compiler-context:/context
      - dkb-compiler-jobs:/jobs
    depends_on:
      dkb-compiler-worker:
        condition: service_healthy
      dkb-embedder:
        condition: service_healthy
        required: false
      dkb-tei:
        condition: service_healthy
        required: false
      dkb-faiss:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7341/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  dkb-compiler-worker:
    image: ${DKB_EVIDENCE_IMAGE:-dkb-evidence-docling-llamaindex:0.1.0}
    environment:
      DKB_COMPILER_JOBS_ROOT: /jobs
      DKB_COMPILER_MODEL: ${DKB_EVIDENCE_TOKENIZER_MODEL:-BAAI/bge-small-en-v1.5}
      DKB_LLAMA_DOCUMENT_BATCH_SIZE: "32"
    volumes:
      - dkb-compiler-jobs:/jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8091/health'))['ok']"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  dkb-embedder:
    image: ${DKB_FASTEMBED_IMAGE:-dkb-embedding-fastembed:0.1.0}
    profiles: ["fastembed"]
    command: ["python", "-m", "uvicorn", "embedder:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      DKB_FASTEMBED_MODEL: ${DKB_FASTEMBED_MODEL:-BAAI/bge-small-en-v1.5}
      DKB_FASTEMBED_MODEL_REPOSITORY: ${DKB_FASTEMBED_MODEL_REPOSITORY:-}
      DKB_FASTEMBED_MODEL_REVISION: ${DKB_FASTEMBED_MODEL_REVISION:-}
    volumes:
      - dkb-fastembed-cache:/cache/fastembed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8090/health'))['ok']"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  dkb-faiss:
    image: ${DKB_FAISS_IMAGE:-dkb-index-faiss:0.1.0}
    profiles: ["faiss"]
    environment:
      DKB_FAISS_ALLOWED_ROOTS: /context,/jobs,/state,/library
      DKB_FAISS_MAX_SESSIONS: "64"
    volumes:
      - ${DKB_STACK_STATE:?DKB_STACK_STATE is required}/compiler-context:/context
      - dkb-compiler-jobs:/jobs
      - ${DKB_STACK_STATE:?DKB_STACK_STATE is required}/runtime:/state
      - ${DKB_LIBRARY_HOST_PATH:?Run dkb stack up to select a Library}:/library
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8092/health'))['ok']"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  dkb-tei:
    image: ${DKB_TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07}
    profiles: ["tei"]
    command:
      - --model-id
      - ${DKB_TEI_MODEL:-BAAI/bge-small-en-v1.5}
      - --revision
      - ${DKB_TEI_MODEL_REVISION:-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a}
      - --port
      - "80"
      - --max-client-batch-size
      - "128"
    ports:
      - "${DKB_TEI_PORT:-8080}:80"
    volumes:
      - dkb-tei-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  dkb-runtime:
    image: ${DKB_RUNTIME_IMAGE:-dkb-runtime:0.2.0}
    environment:
      DKB_RUNTIME_HOST: 0.0.0.0
      DKB_RUNTIME_PORT: 7331
      DKB_RUNTIME_STATE_ROOT: /state
      DKB_LIBRARY_PATH: /library
      DKB_PIPELINE_TARGET: ${DKB_RUNTIME_PIPELINE_TARGET:-default}
      DKB_RUNTIME_ID: ${DKB_STACK_NAME:-local}-runtime
      DKB_PUBLIC_URL: ${DKB_PUBLIC_URL:-http://127.0.0.1:7331}
      DKB_MCP_PUBLIC_BASE_URL: ${DKB_MCP_PUBLIC_BASE_URL:-http://127.0.0.1:7331}
      DKB_MCP_PUBLIC_DOCUMENTS: "true"
      DKB_REGISTRY_URL: http://registry-web:8000
      DKB_QUERY_EMBEDDER_URL: http://dkb-embedder:8090/embed
      DKB_TEI_URL: http://dkb-tei:80
      DKB_FAISS_SERVICE_URL: http://dkb-faiss:8092
      DKB_MCP_HTTP_ENABLED: "true"
      DKB_MCP_BEARER_TOKEN: ${DKB_MCP_BEARER_TOKEN:?Run dkb stack up to generate stack secrets}
      DKB_MCP_ALLOW_INSECURE_NO_AUTH: ${DKB_MCP_ALLOW_INSECURE_NO_AUTH:-false}
      DKB_RUNTIME_ADMIN_TOKEN: ${DKB_RUNTIME_ADMIN_TOKEN:?Run dkb stack up to generate stack secrets}
      DKB_MCP_ALLOWED_HOSTS: ${DKB_MCP_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DKB_MCP_ALLOWED_ORIGINS: ${DKB_MCP_ALLOWED_ORIGINS:-127.0.0.1,localhost}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${DKB_MEILI_MASTER_KEY}
    volumes:
      - ${DKB_STACK_STATE:?DKB_STACK_STATE is required}/runtime:/state
      - ${DKB_LIBRARY_HOST_PATH:?Run dkb stack up to select a Library}:/library
    ports:
      - "${DKB_RUNTIME_PORT:-7331}:7331"
    depends_on:
      dkb-embedder:
        condition: service_healthy
        required: false
      dkb-tei:
        condition: service_healthy
        required: false
      dkb-faiss:
        condition: service_healthy
        required: false
      meilisearch:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7331/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  meilisearch:
    image: ${DKB_MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.29}
    profiles: ["meilisearch"]
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${DKB_MEILI_MASTER_KEY}
    ports:
      - "${DKB_MEILI_PORT:-7700}:7700"
    volumes:
      - ${DKB_STACK_STATE:?DKB_STACK_STATE is required}/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  dkb-compiler-jobs:
  dkb-fastembed-cache:
  dkb-tei-cache:
