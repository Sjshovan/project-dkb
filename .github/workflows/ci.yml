name: CI

on:
  pull_request:
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run graph:check
      - run: npm run boundaries:check
      - run: npm run agents:check
      - run: npm run check
      - run: npm test
      - run: npm run package:check
      - run: npm run temp:audit
