name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Changesets comparison branch
        if: github.event_name == 'pull_request'
        run: git branch development origin/development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run version:status
      - run: npm run graph:check
      - run: npm run boundaries:check
      - run: npm run agents:check
      - run: npm run docs:check
      - run: npm run check
      - run: npm test
        if: runner.os != 'Windows'
      - name: Verify Windows Docker Compose prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Admit the installed tool once; the real Stack test still exercises
          # the unchanged five-second production probe after this setup.
          @'
          import { spawnSync } from 'node:child_process';
          const started = performance.now();
          const result = spawnSync('docker', ['compose', 'version'], {
            encoding: 'utf8', timeout: 30_000, windowsHide: true,
          });
          console.log(JSON.stringify({ prerequisite: 'docker compose version',
            elapsedMs: performance.now() - started, status: result.status,
            signal: result.signal, errorCode: result.error?.code ?? null,
            stdout: String(result.stdout ?? '').slice(-2048),
            stderr: String(result.stderr ?? '').slice(-2048) }));
          if (result.error || result.status !== 0 || !String(result.stdout ?? '').trim()) {
            throw new Error('Windows CI requires a working installed Docker Compose; prerequisite failed.');
          }
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows with isolated Docker and provider packaging
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DKB_REQUIRE_DOCKER_TESTS: '1'
        run: |
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Real Docker, OS storage probes and packaging need their own process budget;
          # preserve deadlines without competing with parallel behavior tests.
          $stack = 'tests/stack.test.mjs'
          $packaging = 'tests/provider-dependency-distribution.test.mjs'
          $storage = 'tests/windows-storage-probe.test.mjs'
          $isolatedFiles = @($stack, $storage, $packaging)
          $testFiles = @(Get-ChildItem -LiteralPath tests -Filter '*.test.mjs' -File | Sort-Object Name | ForEach-Object { "tests/$($_.Name)" })
          foreach ($isolated in $isolatedFiles) {
            if (($testFiles | Where-Object { $_ -eq $isolated }).Count -ne 1) { throw "$isolated must be included exactly once." }
          }
          $parallelFiles = @($testFiles | Where-Object { $_ -notin $isolatedFiles })
          if ($parallelFiles.Count -eq 0) { throw 'No parallel behavior tests were found.' }
          # Each test file may launch more processes. Match workers to this
          # runner's CPU allocation while keeping all files and deadlines.
          $testCpuCount = & node -p 'require("node:os").availableParallelism()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testConcurrency = [Math]::Max(1, [Math]::Min(4, [int]$testCpuCount))
          Write-Output "Running $($testFiles.Count) test files with at most $testConcurrency workers."
          node --import ./tests/test-environment.mjs --test --test-concurrency=1 $stack
          $stackExit = $LASTEXITCODE
          node --import ./tests/test-environment.mjs --test --test-concurrency=1 $storage
          $storageExit = $LASTEXITCODE
          node --import ./tests/test-environment.mjs --test --test-concurrency=$testConcurrency @parallelFiles
          $parallelExit = $LASTEXITCODE
          node --import ./tests/test-environment.mjs --test --test-concurrency=$testConcurrency $packaging
          $packagingExit = $LASTEXITCODE
          if ($stackExit -ne 0) { exit $stackExit }
          if ($storageExit -ne 0) { exit $storageExit }
          if ($parallelExit -ne 0) { exit $parallelExit }
          exit $packagingExit
      - name: Verify Linux volume ownership preservation
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none --read-only --user 0:0 \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace \
            node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 \
            node --import ./tests/test-environment.mjs --test tests/stack-volume-ownership.linux.mjs
      - run: npm run package:check
      - name: Verify Linux Library management and Stack configuration recovery
        if: runner.os == 'Linux'
        run: |
          cli_version="$(node -p "require('./apps/cli/package.json').version")"
          docker build --build-arg "DKB_VERSION=$cli_version" --build-arg "DKB_COMMIT=$GITHUB_SHA" -f apps/cli/Dockerfile -t dkb-cli:owner-candidate .
          node tests/library-owner-cli-proof.mjs --run
          node tests/stack-owner-proof.mjs --run
      - run: npm run temp:audit
