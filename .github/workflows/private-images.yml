name: Private container release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push images to private GHCR packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dkb-compiler
            dockerfile: services/compiler/Dockerfile
            package: services/compiler/package.json
            context: .
          - image: dkb-runtime
            dockerfile: services/runtime/Dockerfile
            package: services/runtime/package.json
            context: .
          - image: dkb-evidence-docling-llamaindex
            dockerfile: Dockerfile
            package: providers/evidence-docling-llamaindex/package.json
            context: providers/evidence-docling-llamaindex/python
          - image: dkb-embedding-fastembed
            dockerfile: Dockerfile
            package: providers/embedding-fastembed/package.json
            context: providers/embedding-fastembed/python
          - image: dkb-index-faiss
            dockerfile: Dockerfile
            package: providers/index-faiss/package.json
            context: providers/index-faiss/python

    steps:
      - uses: actions/checkout@v4

      - name: Refuse non-private repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" = "private" || {
            echo "This workflow publishes only from a private repository." >&2
            exit 1
          }

      - uses: docker/setup-buildx-action@v3

      - name: Resolve component version
        id: version
        run: node -p '"value=" + require("./${{ matrix.package }}").version' >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/sjshovan/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.publish }}
          load: ${{ ! inputs.publish }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            DKB_VERSION=${{ steps.version.outputs.value }}
            DKB_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        if: ${{ inputs.publish }}
        with:
          subject-name: ghcr.io/sjshovan/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
